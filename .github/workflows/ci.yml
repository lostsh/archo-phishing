name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  html:
    name: HTML valide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npx --yes html-validate@9 index.html dev.html
      - run: node --check app.js

  typographie:
    name: Typographie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_typo.py

  mise-en-page:
    name: Mise en page (navigateur)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pip install playwright==1.* && python3 -m playwright install --with-deps chromium
      - run: python3 scripts/check_layout.py
